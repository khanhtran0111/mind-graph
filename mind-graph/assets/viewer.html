<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Mind graph</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1c1f; --ink-2: #55555c; --ink-3: #8b8b92;
  --line: #e2e0d8; --chip: #efede6; --accent: #2b67d8; --link: #9d998e; --match: #d99a00; --stale: #d1453b; --add: #1f9d55;
  --n-sat: 70%; --n-fill: 97.5%; --n-stroke: 50%; --p-fill: 90%; --p-text: 23%; --e-l: 56%;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --panel: #1b1c20; --ink: #ececef; --ink-2: #a6a6ad; --ink-3: #74747b;
    --line: #2c2d33; --chip: #26272c; --accent: #79a6ff; --link: #6a6b72; --match: #f0b429; --stale: #ff6b61; --add: #5fd38d;
    --n-sat: 20%; --n-fill: 16%; --n-stroke: 58%; --p-fill: 25%; --p-text: 88%; --e-l: 48%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --panel: #1b1c20; --ink: #ececef; --ink-2: #a6a6ad; --ink-3: #74747b;
  --line: #2c2d33; --chip: #26272c; --accent: #79a6ff; --link: #6a6b72; --match: #f0b429; --stale: #ff6b61; --add: #5fd38d;
  --n-sat: 20%; --n-fill: 16%; --n-stroke: 58%; --p-fill: 25%; --p-text: 88%; --e-l: 48%;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; z-index: 3; }
.brand { min-width: 0; flex: 1 1 220px; }
.brand h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; flex: 0 1 280px; min-width: 160px; }
.search input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); max-height: 340px; overflow: auto; display: none; z-index: 10; }
.results.open { display: block; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; cursor: pointer; }
.results button:hover, .results button.kb { background: var(--chip); }
.results .crumb { font-size: 11px; color: var(--ink-3); }
.results .empty { padding: 10px; color: var(--ink-3); font-size: 13px; }
.tools { display: flex; gap: 4px; flex-wrap: wrap; }
.tools button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  font-size: 12.5px; white-space: nowrap; }
.tools button:hover { border-color: var(--ink-3); }
.tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

main { flex: 1; position: relative; min-height: 0; display: flex; }
#stage { flex: 1; position: relative; min-width: 0; }
svg#canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
svg#canvas.dragging { cursor: grabbing; }

.edge { fill: none; stroke: hsl(var(--h) 50% var(--e-l)); stroke-linecap: round; opacity: .75; }
.edge.on-path { opacity: 1; stroke-width: 3 !important; }
.xlink { fill: none; stroke: var(--link); stroke-width: 1.3; stroke-dasharray: 5 4; opacity: .7; }
.xlink.hot { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }
.xlink.faded { opacity: .15; }
.xlabel { font-size: 11px; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node { cursor: pointer; }
.node rect.box { fill: hsl(var(--h) var(--n-sat) var(--n-fill)); stroke: hsl(var(--h) 55% var(--n-stroke)); stroke-width: 1.1; }
.node text { fill: var(--ink); dominant-baseline: central; }
.node .ic { fill: hsl(var(--h) 55% var(--n-stroke)); font-size: 12px; }
.node.d1 rect.box { fill: hsl(var(--h) 60% var(--p-fill)); stroke-width: 1.6; }
.node.d1 text.lb { fill: hsl(var(--h) 55% var(--p-text)); }
.node.root rect.box { fill: var(--ink); stroke: var(--ink); }
.node.root text.lb { fill: var(--bg); }
.node.k-question rect.box { stroke-dasharray: 4 3; }
.node:hover rect.box { stroke-width: 2; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.6; }
.node.match rect.box { stroke: var(--match); stroke-width: 2.6; }
.node.on-path rect.box { stroke-width: 1.8; }
.flag { stroke: var(--panel); stroke-width: 1.6; }
.flag.f1 { fill: var(--match); } .flag.f2 { fill: var(--stale); }
.subflag { fill: none; stroke-width: 1.8; } .subflag.f1 { stroke: var(--match); } .subflag.f2 { stroke: var(--stale); }
.chip.ev-ok { background: none; border: 1px solid var(--line); }
.chip.ev-changed { background: var(--match); color: #1c1c1f; } .chip.ev-stale { background: var(--stale); color: #fff; }
.ev { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 8px 0; font-size: 12.5px; }
.ev.changed { border-left-color: var(--match); } .ev.stale { border-left-color: var(--stale); }
.ev q { display: block; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); white-space: pre-wrap; quotes: none; }
.ev .st { color: var(--ink-3); font-size: 11.5px; }
.evlist button { display: block; border: 0; background: none; padding: 3px 0; cursor: pointer; color: var(--ink); font-size: 12.5px; text-align: left; }
.evlist button:hover { color: var(--accent); }
.node.df-added rect.box { stroke: var(--add); stroke-width: 2.2; }
.node.df-removed { opacity: .62; }
.node.df-removed rect.box { stroke: var(--stale); stroke-width: 1.8; stroke-dasharray: 4 3; }
.node.df-removed text.lb { text-decoration: line-through; }
.node.df-changed rect.box { stroke: var(--match); stroke-width: 2.2; }
.node.df-moved rect.box { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 7 3; }
.dbadge circle { stroke: var(--panel); stroke-width: 1.5; }
.dbadge text { fill: #fff; font-size: 12.5px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.dbadge.added circle { fill: var(--add); } .dbadge.removed circle { fill: var(--stale); }
.dbadge.changed circle { fill: var(--match); } .dbadge.moved circle { fill: var(--accent); }
.dsub { fill: none; stroke: var(--match); stroke-width: 1.8; stroke-dasharray: 2 2; }
.xlink.df-added { stroke: var(--add); opacity: .95; stroke-dasharray: none; stroke-width: 1.6; }
.xlink.df-removed { stroke: var(--stale); opacity: .6; }
.xlink.df-changed { stroke: var(--match); opacity: .95; }
.chip.df-added { background: var(--add); color: #0b0c0f; } .chip.df-removed { background: var(--stale); color: #fff; }
.chip.df-changed { background: var(--match); color: #1c1c1f; } .chip.df-moved { background: var(--accent); color: #fff; }
.dchg ul { padding-left: 18px; margin: 4px 0; font-size: 12.5px; }
.dchg .before { font-size: 12.5px; color: var(--ink-3); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-top: 6px; }
.dgroup { margin-top: 14px; } .dgroup h3 { display: flex; gap: 6px; align-items: center; }
.dgroup button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--ink); font-size: 12.5px; }
.dgroup button:hover { color: var(--accent); } .dgroup button .d { color: var(--ink-3); font-size: 11.5px; }
.dgroup .lk { font-size: 12px; color: var(--ink-2); padding: 2px 0; }
.chip.pref { background: none; border: 1px solid var(--accent); color: var(--accent); }
.devbox { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 12.5px; margin: 10px 0 4px;
  padding: 10px 12px; border-radius: 10px; background: var(--chip); }
.devbox b { color: var(--ink-3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding-top: 1px; }
table.pmap { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.pmap td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
table.pmap td.ref { white-space: nowrap; font-weight: 600; }
table.pmap td.st { white-space: nowrap; }
table.pmap a, .pdev a { color: var(--accent); cursor: pointer; text-decoration: none; }
table.pmap tr.deviates td.st { color: var(--stale); font-weight: 600; }
table.pmap tr.missing td.st, table.pmap tr.unmapped td { color: var(--ink-3); }
.pdev { border-left: 3px solid var(--stale); padding: 2px 0 2px 10px; margin: 8px 0; font-size: 12.5px; }
.pdev .t { color: var(--ink-3); font-size: 11.5px; }
.tog circle { fill: var(--panel); stroke: hsl(var(--h) 50% var(--n-stroke)); stroke-width: 1.2; }
.tog text { fill: hsl(var(--h) 55% var(--n-stroke)); font-size: 11px; font-weight: 700; text-anchor: middle; }
.tog:hover circle { fill: hsl(var(--h) 60% var(--p-fill)); }

aside#panel { width: 380px; max-width: 100%; border-left: 1px solid var(--line); background: var(--panel); display: flex;
  flex-direction: column; min-height: 0; }
aside#panel.hidden { display: none; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); align-items: flex-end; }
.tabs button { border: 0; background: none; padding: 7px 10px; border-bottom: 2px solid transparent; cursor: pointer;
  color: var(--ink-2); font-size: 13px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tabs .x { margin-left: auto; color: var(--ink-3); font-size: 18px; line-height: 1; padding: 4px 8px 8px; }
.pane { overflow: auto; padding: 16px 18px 28px; flex: 1; }
.pane[hidden] { display: none; }
.crumbs { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
.crumbs a { color: var(--ink-2); cursor: pointer; text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.pane h2 { font-size: 19px; line-height: 1.3; margin: 0 0 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); }
.chip.core { background: var(--ink); color: var(--bg); }
.summary { font-size: 14.5px; margin: 0 0 12px; }
.details { color: var(--ink-2); font-size: 13.5px; }
.details ul { padding-left: 18px; margin: 6px 0; }
.details p { margin: 6px 0; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); padding: 1px 5px; border-radius: 4px;
  word-break: break-all; }
.sec { margin-top: 18px; }
.sec h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; font-weight: 600; }
.src { display: block; margin: 3px 0; font-size: 12.5px; }
.src a { color: var(--accent); text-decoration: none; }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.kids button, .rel button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 9px; cursor: pointer;
  font-size: 12.5px; text-align: left; }
.kids button:hover, .rel button:hover { border-color: var(--accent); }
.rel { display: grid; gap: 5px; }
.rel .r { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; }
.rel .t { color: var(--ink-3); white-space: nowrap; font-size: 11.5px; min-width: 92px; }
.stopnav { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 10px 12px; background: var(--chip); border-radius: 10px;
  font-size: 12.5px; }
.stopnav .note { flex: 1; color: var(--ink-2); }
.stopnav button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
.stopnav button:disabled { opacity: .35; cursor: default; }
ol.path { padding: 0; margin: 0; list-style: none; counter-reset: s; }
ol.path li { counter-increment: s; position: relative; padding: 9px 10px 9px 40px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
ol.path li::before { content: counter(s); position: absolute; left: 10px; top: 9px; width: 21px; height: 21px; border-radius: 50%;
  background: var(--chip); font-size: 11.5px; font-weight: 650; display: grid; place-items: center; }
ol.path li:hover { background: var(--chip); }
ol.path li.on { background: var(--chip); }
ol.path li.on::before { background: var(--accent); color: #fff; }
ol.path .lb { font-weight: 600; font-size: 13.5px; }
ol.path .nt { color: var(--ink-2); font-size: 12.5px; }
dl.gloss dt { font-weight: 650; margin-top: 10px; }
dl.gloss dd { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
dl.gloss a { color: var(--accent); cursor: pointer; font-size: 12px; }
.meta-p { color: var(--ink-2); font-size: 13px; }

.legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 11.5px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 24px);
  box-shadow: var(--shadow); }
.legend span b { font-weight: 400; color: var(--ink); margin-right: 3px; }
.legend .dash { display: inline-block; width: 18px; border-top: 1.5px dashed var(--link); vertical-align: middle; margin-right: 4px; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer;
  font-size: 16px; box-shadow: var(--shadow); }
.hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--ink-3);
  background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; transition: opacity .6s; white-space: nowrap; }
.hint.gone { opacity: 0; pointer-events: none; }
.nodata { padding: 40px; color: var(--ink-2); }

@media (max-width: 760px) {
  header { padding: 8px 12px; gap: 8px; }
  .brand { flex-basis: 100%; }
  .search { flex: 1 1 auto; }
  main { flex-direction: column; }
  aside#panel { width: 100%; height: 46vh; border-left: 0; border-top: 1px solid var(--line); }
  .legend { display: none; }
  .hint { display: none; }
  .tools { width: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .tools button { padding: 5px 8px; font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search nodes, files, tags…  ( / )" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <div class="tools">
    <button id="bTour" title="Walk the learning path">▶ Learning path</button>
    <button id="bExpand" title="Expand everything">Expand all</button>
    <button id="bCollapse" title="Show only the main branches">Collapse</button>
    <button id="bLinks" aria-pressed="true" title="Show cross-links">Links</button>
    <button id="bFit" title="Fit to screen (F)">Fit</button>
    <button id="bTheme" title="Toggle light/dark" aria-label="Toggle light/dark"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="canvas" aria-label="Mind graph">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/></marker>
        <marker id="arrHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
      </defs>
      <g id="vp"><g id="gEdges"></g><g id="gLinks"></g><g id="gNodes"></g><g id="gLabels"></g></g>
    </svg>
    <div class="hint" id="hint">Click a node for details · ± to expand · drag to pan · scroll to zoom</div>
    <div class="legend" id="legend"></div>
    <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button></div>
  </div>
  <aside id="panel">
    <div class="tabs" id="tabs">
      <button data-tab="node" class="on">Node</button>
      <button data-tab="path">Learning path</button>
      <button data-tab="gloss" id="tabGloss">Glossary</button>
      <button data-tab="changes" id="tabChanges" style="display:none">Changes</button>
      <button data-tab="paper" id="tabPaper" style="display:none">Paper ↔ Code</button>
      <button data-tab="about">About</button>
      <button class="x" id="closePanel" aria-label="Close panel">×</button>
    </div>
    <div class="pane" id="pane-node"></div>
    <div class="pane" id="pane-path" hidden></div>
    <div class="pane" id="pane-gloss" hidden></div>
    <div class="pane" id="pane-changes" hidden></div>
    <div class="pane" id="pane-paper" hidden></div>
    <div class="pane" id="pane-about" hidden></div>
  </aside>
</main>
<script id="graph-data">window.__MG__ = /*__GRAPH_DATA__*/null;</script>
<script>
(function () {
  "use strict";
  const DATA = window.__MG__;
  const $ = (s) => document.querySelector(s);
  if (!DATA || !DATA.root) { document.querySelector("main").innerHTML = '<div class="nodata">No graph data. Build with build_mindgraph.py.</div>'; return; }

  const SVGNS = "http://www.w3.org/2000/svg";
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif';
  const ICON = { concept: "◆", module: "▣", file: "▤", symbol: "ƒ", doc: "¶", data: "◍", external: "⬡", question: "?" };
  const KIND_NAME = { concept: "concept", module: "module", file: "file", symbol: "symbol", doc: "doc", data: "data", external: "external", question: "open question" };
  const HUES = [212, 152, 22, 276, 340, 186, 95, 46, 248, 4];
  const GAP_ROOT = 46, GAP = 40, PILLAR_GAP = 18, DUR = 320;
  const meta = DATA.meta || {};
  const root = DATA.root;
  const links = DATA.links || [];
  const pathStops = (DATA.learning_path || []).filter((s) => s && s.node);
  const glossary = DATA.glossary || [];

  // ---------- index ----------
  const byId = new Map(), all = [];
  (function index(n, parent, depth, pi) {
    n.children = Array.isArray(n.children) ? n.children : [];
    n._parent = parent; n._depth = depth;
    n.kind = n.kind || (depth === 0 ? "root" : "concept");
    n._hue = depth === 0 ? 220 : HUES[pi % HUES.length];
    n._open = depth === 0 ? true : (n.collapsed != null ? !n.collapsed : depth < 2);
    byId.set(n.id, n); all.push(n);
    n.children.forEach((c, i) => index(c, n, depth + 1, depth === 0 ? i : pi));
  })(root, null, 0, 0);
  const FLAG = { changed: 1, stale: 2 };
  all.forEach((n) => { n._flag = FLAG[n.evidence_status] || 0; n._sub = 0; });
  for (let i = all.length - 1; i >= 0; i--) { const n = all[i], p = n._parent; if (p) p._sub = Math.max(p._sub, n._flag, n._sub); }
  const DIFF = DATA.diff || null, DSYM = { added: "+", removed: "−", changed: "~", moved: "↷" };
  if (DIFF) { // open exactly the branches that contain changes
    all.forEach((n) => { n._dsub = 0; });
    for (let i = all.length - 1; i >= 0; i--) { const n = all[i], p = n._parent; if (p) p._dsub += n._dsub + (n.diff ? 1 : 0); }
    all.forEach((n) => { if (n._depth > 0 && n.collapsed == null) n._open = n._dsub > 0; });
  }
  const pathIndex = new Map(); pathStops.forEach((s, i) => { if (!pathIndex.has(s.node)) pathIndex.set(s.node, i); });
  const outLinks = new Map(), inLinks = new Map();
  links.forEach((l) => {
    if (!byId.has(l.from) || !byId.has(l.to)) return;
    (outLinks.get(l.from) || outLinks.set(l.from, []).get(l.from)).push(l);
    (inLinks.get(l.to) || inLinks.set(l.to, []).get(l.to)).push(l);
  });

      h.push(`<div class="sec dchg"><h3>Changes</h3>${what}${(n.diff_detail || []).length ? `<ul>${n.diff_detail.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>` : ""}${n.old_summary != null ? `<div class="before"><b>Before:</b> ${inline(n.old_summary || "—")}</div>` : ""}</div>`);
    }
    if (n.deviation) {
      const d = n.deviation;
      h.push(`<div class="devbox"><b>Type</b><span>${esc(String(d.type || "other").replace(/_/g, " "))}</span>${d.paper ? `<b>Paper</b><span>${inline(d.paper)}</span>` : ""}${d.code ? `<b>Code</b><span>${inline(d.code)}</span>` : ""}${d.impact ? `<b>Impact</b><span>${inline(d.impact)}</span>` : ""}</div>`);
    }
    if (n.details) h.push(`<div class="details">${rich(n.details)}</div>`);
    if ((n.evidence || []).length) {
      const why = { ok: "found, unchanged", changed: "found, but the text around it changed — re-read", stale: "no longer found in the source" };
      const loc = (e) => { const at = String(e.at || ""), m = at.match(/^L(\d+(?:-\d+)?)$/), p = at.match(/^page (\d+)/); return { path: e.path, lines: m ? m[1] : undefined, page: p ? p[1] : undefined, section: !m && !p && at ? at : undefined }; };
      h.push(`<div class="sec"><h3>Evidence</h3>${n.evidence.map((e) => `<div class="ev ${esc(e.status || "")}"><q>${esc(e.quote || "")}</q>${srcHtml(loc(e))}<span class="st">${esc(why[e.status] || "")}${e.verified ? ` · verified ${esc(e.verified)}` : ""}</span></div>`).join("")}</div>`);
    }
    if ((n.sources || []).length) h.push(`<div class="sec"><h3>Where to look</h3>${n.sources.map(srcHtml).join("")}</div>`);
    if (n.children.length) h.push(`<div class="sec"><h3>Inside (${n.children.length})</h3><div class="kids">${n.children.map((k) => `<button data-go="${esc(k.id)}">${esc(ICON[k.kind] ? ICON[k.kind] + " " : "")}${esc(k.label)}</button>`).join("")}</div></div>`);
    const outs = outLinks.get(n.id) || [], ins = inLinks.get(n.id) || [];
    if (outs.length || ins.length) {
      h.push(`<div class="sec"><h3>Relationships</h3><div class="rel">`
        + outs.map((l) => `<div class="r"><span class="t">${esc(typeName(l.type))} →</span><button data-go="${esc(l.to)}">${esc(byId.get(l.to).label)}</button>${l.label ? `<span class="t">${esc(l.label)}</span>` : ""}</div>`).join("")
        + ins.map((l) => `<div class="r"><span class="t">← ${esc(typeName(l.type))}</span><button data-go="${esc(l.from)}">${esc(byId.get(l.from).label)}</button>${l.label ? `<span class="t">${esc(l.label)}</span>` : ""}</div>`).join("")
        + `</div></div>`);
    }
    if (pathIndex.has(n.id)) {
      const i = pathIndex.get(n.id);
      h.push(`<div class="stopnav"><button data-step="${i - 1}" ${i === 0 ? "disabled" : ""} aria-label="Previous stop">‹</button><span class="note"><b>Stop ${i + 1}/${pathStops.length}.</b> ${inline(pathStops[i].note || "")}</span><button data-step="${i + 1}" ${i === pathStops.length - 1 ? "disabled" : ""} aria-label="Next stop">›</button></div>`);
    }
    const pane = $("#pane-node"); pane.innerHTML = h.join(""); pane.scrollTop = 0;
  }
  function renderPath() {
    const pane = $("#pane-path");
    if (!pathStops.length) { pane.innerHTML = '<p class="meta-p">No learning path in this graph.</p>'; return; }
    pane.innerHTML = '<p class="meta-p" style="margin-top:0">A suggested order for reading the graph. Use ← / → to step through.</p><ol class="path">'
      + pathStops.map((s, i) => { const n = byId.get(s.node); return n ? `<li data-step="${i}"><div class="lb">${esc(n.label)}</div><div class="nt">${inline(s.note || "")}</div></li>` : ""; }).join("") + "</ol>";
    markPath();
  }
  function markPath() { document.querySelectorAll("ol.path li").forEach((li) => li.classList.toggle("on", pathStops[+li.dataset.step] && pathStops[+li.dataset.step].node === selected)); }
  function renderGloss() {
    $("#pane-gloss").innerHTML = '<dl class="gloss">' + glossary.map((t) => `<dt>${esc(t.term)}</dt><dd>${inline(t.definition || "")}${t.node && byId.has(t.node) ? ` <a data-go="${esc(t.node)}">→ ${esc(byId.get(t.node).label)}</a>` : ""}</dd>`).join("") + "</dl>";
  }
  function renderChanges() {
    if (!DIFF) return;
    const c = DIFF.counts || {}, lc = DIFF.links || {};
    const ver = (v) => [v.label, v.git_commit ? "commit " + v.git_commit : "", v.generated_at ? String(v.generated_at).slice(0, 10) : ""].filter(Boolean).map(esc).join(" · ");
    const h = [`<h2>Changes</h2><p class="meta-p">${ver(DIFF.old)}<br>→ ${ver(DIFF.new)}</p>`];
    h.push(`<div class="chips"><span class="chip df-added">+ ${c.added || 0} added</span><span class="chip df-removed">− ${c.removed || 0} removed</span><span class="chip df-changed">~ ${c.changed || 0} changed</span><span class="chip df-moved">↷ ${c.moved || 0} moved</span><span class="chip">links +${lc.added || 0} −${lc.removed || 0} ~${lc.changed || 0}</span></div>`);
    if ((DIFF.areas || []).length) h.push(`<div class="sec"><h3>Areas most changed</h3>${DIFF.areas.slice(0, 8).map(([name, cc]) => `<div class="lk"><b>${esc(name)}</b> · ${Object.entries(cc).map(([k, v]) => `${DSYM[k]}${v}`).join(" ")}</div>`).join("")}</div>`);
    const groups = { added: [], removed: [], changed: [], moved: [] };
    all.forEach((n) => { if (n.diff && groups[n.diff]) groups[n.diff].push(n); });
    const crumb = (n) => { const a = []; let p = n._parent; while (p && p._depth > 0) { a.unshift(p.label); p = p._parent; } return a.join(" › "); };
    Object.entries(groups).forEach(([k, ns]) => {
      if (!ns.length) return;
      h.push(`<div class="dgroup"><h3><span class="chip df-${k}">${DSYM[k]}</span> ${k} (${ns.length})</h3>${ns.map((n) => `<button data-go="${esc(n.id)}">${esc(n.label)} <span class="d">${esc(crumb(n))}${n.diff_detail && k !== "removed" ? " · " + esc(n.diff_detail.slice(0, 2).join("; ")) : ""}</span></button>`).join("")}</div>`);
    });
    const ld = links.filter((l) => l.diff);
    if (ld.length) {
      const nm = (id) => esc((byId.get(id) || { label: id }).label);
      h.push(`<div class="dgroup"><h3>Relationships (${ld.length})</h3>${ld.map((l) => `<div class="lk"><span class="chip df-${esc(l.diff)}">${DSYM[l.diff]}</span> ${nm(l.from)} —${esc(l.type || "related")}→ ${nm(l.to)}${l.diff_detail ? ` <span class="d">(${esc(l.diff_detail.join("; "))})</span>` : ""}</div>`).join("")}</div>`);
    }
    $("#pane-changes").innerHTML = h.join("");
  }
  function renderPaper() {
    const pm = DATA.paper_map; if (!pm) return;
    const c = pm.counts || {}, go = (x) => `<a data-go="${esc(x.id)}">${esc(x.label)}</a>`;
    const h = [`<h2>Paper ↔ Code</h2><p class="meta-p">${pm.rows.length} paper items · ${c.exact || 0} ✓ exact · ${(c.approx || 0) + (c.mapped || 0)} ≈ approx · ${c.partial || 0} ◐ partial · <b style="color:var(--stale)">${c.deviates || 0} ⚠ deviate</b> · ${c.missing || 0} ∅ not in code${pm.extras.length ? ` · ${pm.extras.length} code-only` : ""}</p>`];
    h.push('<table class="pmap"><tbody>' + pm.rows.map((r) => `<tr class="${esc(r.status)}"><td class="ref">${esc(r.pretty)}</td><td>${r.nodes.map(go).join(", ") || esc(r.paper_text || "")}${r.implementers.length ? `<div style="color:var(--ink-3)">→ ${r.implementers.map((x) => go(x) + (x.fidelity ? ` <span>(${esc(x.fidelity)})</span>` : "")).join(", ")}</div>` : ""}${r.deviations.length ? `<div>≠ ${r.deviations.map(go).join(", ")}</div>` : ""}</td><td class="st">${esc(r.symbol)} ${esc(r.status)}</td></tr>`).join("")
      + (pm.unmapped || []).map((u) => `<tr class="unmapped"><td class="ref">${esc(u.pretty)}</td><td>${esc(u.text || "")} <i>(not mapped yet)</i></td><td class="st">?</td></tr>`).join("") + "</tbody></table>");
    const devs = [], seen = new Set();
    pm.rows.forEach((r) => r.deviations.forEach((d) => { if (!seen.has(d.id)) { seen.add(d.id); devs.push(d); } }));
    pm.extras.forEach((d) => { if (!seen.has(d.id)) { seen.add(d.id); devs.push(d); } });
    if (devs.length) h.push(`<div class="sec"><h3>Deviations (${devs.length})</h3>${devs.map((d) => `<div class="pdev">${go(d)} <span class="t">· ${esc(String(d.type).replace(/_/g, " "))}</span>${d.paper ? `<div><span class="t">paper</span> ${inline(d.paper)}</div>` : ""}${d.code ? `<div><span class="t">code</span> ${inline(d.code)}</div>` : ""}${d.impact ? `<div><span class="t">impact</span> ${inline(d.impact)}</div>` : ""}</div>`).join("")}</div>`);
    $("#pane-paper").innerHTML = h.join("");
  }
  function renderAbout() {
    const s = meta.stats || {}, h = [];
    h.push(`<h2>${esc(meta.title || root.label)}</h2>`);
    if (root.summary) h.push(`<p class="summary">${inline(root.summary)}</p>`);
    h.push(`<p class="meta-p">${all.length} nodes · ${links.length} cross-links${meta.git_commit ? ` · commit <code>${esc(meta.git_commit)}</code>` : ""}${meta.generated_at ? ` · built ${esc(String(meta.generated_at).slice(0, 10))}` : ""}</p>`);
    const ev = meta.evidence;
    if (ev && ev.nodes_with_evidence) {
      const fl = all.filter((n) => n._flag).sort((a, b) => b._flag - a._flag);
      h.push(`<div class="sec"><h3>Evidence</h3><p class="meta-p">${ev.nodes_with_evidence} nodes backed by quotes from their sources · ${ev.ok} ok · ${ev.changed} changed · ${ev.stale} stale <span style="color:var(--ink-3)">(checked ${esc(String(ev.checked_at || "").slice(0, 10))})</span></p>`
        + (fl.length ? `<div class="evlist">${fl.map((n) => `<button data-go="${esc(n.id)}"><svg width="10" height="10" style="vertical-align:0"><circle class="flag f${n._flag}" cx="5" cy="5" r="4"/></svg> ${esc(n.label)} <span style="color:var(--ink-3)">· ${esc(n.evidence_status)}</span></button>`).join("")}</div>` : "")
        + `</div>`);
    }
    if (meta.scope) h.push(`<div class="sec"><h3>Scope</h3><p class="meta-p">${inline(meta.scope)}</p></div>`);
    if ((meta.sources_read || []).length) h.push(`<div class="sec"><h3>Read to build this map (${meta.sources_read.length})</h3>${meta.sources_read.map((p) => { const m = String(p).trim().match(/^(.*?)\s*(?:\(([^()]*)\)|(§.*))?$/); return srcHtml(m ? { path: m[1], section: m[2] || m[3] } : { path: String(p) }); }).join("")}</div>`);
    h.push(`<div class="sec"><h3>Keys</h3><p class="meta-p"><code>/</code> search · <code>←</code> <code>→</code> learning path · <code>F</code> fit · <code>Esc</code> close</p></div>`);
    $("#pane-about").innerHTML = h.join("");
  }
  function step(i) { if (i < 0 || i >= pathStops.length) return; select(pathStops[i].node); }

  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]"); if (go) { e.preventDefault(); select(go.dataset.go); clearSearch(); return; }
    const stp = e.target.closest("[data-step]"); if (stp && !stp.disabled) { step(+stp.dataset.step); return; }
  });
  $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) openPanel(b.dataset.tab); });
  $("#closePanel").addEventListener("click", () => { panel.classList.add("hidden"); selected = null; onPath = new Set(); sync(); kick(); });
  $("#bTour").addEventListener("click", () => { renderPath(); openPanel("path"); if (pathStops.length) step(selected && pathIndex.has(selected) ? pathIndex.get(selected) : 0); });
  $("#bExpand").addEventListener("click", () => { setAll(true); relayout(); setTimeout(() => fit(), DUR + 20); });
  $("#bCollapse").addEventListener("click", () => { setAll(true, 1); relayout(); setTimeout(() => fit(), DUR + 20); });
  $("#bFit").addEventListener("click", () => fit());
  $("#bLinks").addEventListener("click", (e) => { showLinks = !showLinks; e.currentTarget.setAttribute("aria-pressed", showLinks); buildLinks(); kick(); });
  $("#bTheme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  });
  $("#zIn").addEventListener("click", () => { const r = stageRect(); zoomAt(1.25, r.width / 2, r.height / 2); });
  $("#zOut").addEventListener("click", () => { const r = stageRect(); zoomAt(0.8, r.width / 2, r.height / 2); });

  // ---------- search (diacritic-insensitive, works for Vietnamese) ----------
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
  all.forEach((n) => { n._hay = norm([n.label, n.id, n.summary, (n.tags || []).join(" "), (n.sources || []).map((s) => (typeof s === "string" ? s : s.path)).join(" ")].join(" ")); n._nl = norm(n.label); });
  const q = $("#q"), res = $("#results"); let hits = [], kb = 0;
  function crumbOf(n) { const a = []; let c = n._parent; while (c && c._depth > 0) { a.unshift(c.label); c = c._parent; } return a.join(" › "); }
  function runSearch() {
    const term = norm(q.value.trim());
    matches = new Set();
    if (!term) { res.classList.remove("open"); sync(); kick(); return; }
    hits = all.filter((n) => n._hay.includes(term)).sort((a, b) => (b._nl.includes(term) - a._nl.includes(term)) || a._depth - b._depth);
    hits.forEach((n) => matches.add(n.id)); kb = 0;
    res.innerHTML = hits.length ? hits.slice(0, 14).map((n, i) => `<button data-go="${esc(n.id)}" class="${i === 0 ? "kb" : ""}"><div>${esc(ICON[n.kind] ? ICON[n.kind] + " " : "")}${esc(n.label)}</div>${n._depth > 1 ? `<div class="crumb">${esc(crumbOf(n))}</div>` : ""}</button>`).join("") : '<div class="empty">No matches</div>';
    res.classList.add("open"); sync(); kick();
  }
  function clearSearch() { res.classList.remove("open"); }
  q.addEventListener("input", runSearch);
  q.addEventListener("focus", () => { if (q.value.trim()) res.classList.add("open"); });
  q.addEventListener("keydown", (e) => {
    const btns = [...res.querySelectorAll("button")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!btns.length) return; kb = (kb + (e.key === "ArrowDown" ? 1 : btns.length - 1)) % btns.length; btns.forEach((b, i) => b.classList.toggle("kb", i === kb)); btns[kb].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { e.preventDefault(); if (btns[kb]) { select(btns[kb].dataset.go); clearSearch(); q.blur(); } }
    else if (e.key === "Escape") { q.value = ""; runSearch(); q.blur(); }
  });
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".search")) clearSearch(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "/") { e.preventDefault(); q.focus(); }
    else if (e.key === "f" || e.key === "F") fit();
    else if (e.key === "Escape") { panel.classList.add("hidden"); selected = null; onPath = new Set(); sync(); kick(); }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      if (!pathStops.length) return; e.preventDefault();
      const cur = selected && pathIndex.has(selected) ? pathIndex.get(selected) : -1;
      step(e.key === "ArrowRight" ? cur + 1 : Math.max(0, cur - 1));
    }
  });

  // ---------- boot ----------
  function hideHint() { $("#hint").classList.add("gone"); }
  setTimeout(hideHint, 6000);
  $("#title").textContent = meta.title || root.label;
  document.title = (meta.title || root.label) + " · Mind graph";
  $("#sub").textContent = [root.summary, meta.git_commit ? "commit " + meta.git_commit : "", meta.generated_at ? String(meta.generated_at).slice(0, 10) : ""].filter(Boolean).join(" · ");
  const kinds = [...new Set(all.filter((n) => n._depth > 0).map((n) => n.kind))].filter((k) => ICON[k]);
  $("#legend").innerHTML = kinds.map((k) => `<span><b>${ICON[k]}</b>${esc(KIND_NAME[k])}</span>`).join("") + (links.length ? '<span><i class="dash"></i>cross-link</span>' : "");
  if (!glossary.length) $("#tabGloss").style.display = "none";
  if (DATA.paper_map) $("#tabPaper").style.display = "";
  if (DIFF) $("#tabChanges").style.display = "";
  renderPath(); renderGloss(); renderChanges(); renderPaper(); renderAbout();
  // start with About open on wide screens, closed on small ones
  if (innerWidth > 760) { openPanel(DIFF ? "changes" : "about"); } else { panel.classList.add("hidden"); }
  if (DIFF) $("#sub").textContent = `Changes: ${DIFF.old.label} → ${DIFF.new.label}`;
  layout(); sync(); commit(); fit(false); kick();
  new ResizeObserver(() => kick()).observe(svg);
})();
</script>
</body>
</html>
